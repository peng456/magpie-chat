<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>magpie chat</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --line: #e6e8ec;
    --text: #17181b;
    --muted: #8a8f99;
    --accent: #17181b;
    --ok: #16a34a;
    --bad: #dc2626;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(16, 18, 22, .04), 0 8px 24px rgba(16, 18, 22, .05);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.65 -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 12px 20px;
    background: rgba(246, 247, 249, .82);
    backdrop-filter: saturate(180%) blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: baseline; gap: 8px; font-weight: 650; letter-spacing: -.01em; }
  .brand small { font-weight: 400; color: var(--muted); font-size: 12px; letter-spacing: 0; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--muted);
    border: 1px solid var(--line); background: var(--card);
    padding: 4px 9px; border-radius: 999px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--ok); box-shadow: 0 0 0 3px rgba(22,163,74,.12); }
  .dot.bad { background: var(--bad); box-shadow: 0 0 0 3px rgba(220,38,38,.12); }
  .spacer { flex: 1 1 auto; }
  .field { display: flex; align-items: center; gap: 8px; }
  select, input[type=text], input[type=password] {
    font: inherit; font-size: 13px;
    color: var(--text); background: var(--card);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 7px 10px; outline: none;
    max-width: 300px;
  }
  select:focus, input:focus { border-color: #c9ccd3; box-shadow: 0 0 0 3px rgba(23,24,27,.05); }
  button {
    font: inherit; font-size: 13px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 10px; padding: 7px 12px;
  }
  button:hover { border-color: #cfd3da; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:disabled { opacity: .45; cursor: default; }
  button.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  main {
    flex: 1 1 auto; overflow-y: auto;
    padding: 26px 20px 150px;
  }
  .wrap { max-width: 820px; margin: 0 auto; }
  .empty {
    max-width: 620px; margin: 8vh auto 0; text-align: center; color: var(--muted);
  }
  .empty h1 { font-size: 22px; color: var(--text); letter-spacing: -.02em; margin: 0 0 8px; }
  .empty p { margin: 0 0 18px; font-size: 14px; }
  .chips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .gwline {
    display: flex; align-items: baseline; justify-content: center; flex-wrap: wrap;
    gap: 5px; margin: 2px 0 20px; font-size: 12px; color: var(--muted);
  }
  .gwline .link {
    background: none; border: 0; padding: 0; font: inherit; cursor: pointer;
    color: #4b515a; border-bottom: 1px dashed #d7dae0;
  }
  .gwline .link:hover { color: var(--text); border-bottom-color: var(--muted); }
  .gwline .link.subtle { color: var(--muted); border-bottom-color: transparent; }
  .gwline .link.subtle:hover { color: var(--text); border-bottom-color: #d7dae0; }
  .gwline-meta { color: var(--muted); }
  .gwline-sep { color: #d7dae0; }
  .chips button { font-size: 13px; color: var(--text); }
  .msg { margin: 0 0 20px; }
  .msg .who { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .msg .who b { font-size: 12px; font-weight: 600; color: var(--text); }
  .bubble {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px 14px; box-shadow: var(--shadow);
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble { background: #eef0f4; border-color: #e4e7ec; box-shadow: none; }
  .bubble.err { border-color: #f0c9c9; background: #fdf3f3; color: #8f2222; }
  .bubble pre {
    margin: 8px 0; padding: 10px 12px; border-radius: 10px;
    background: #f6f7f9; border: 1px solid var(--line);
    overflow-x: auto; white-space: pre;
    font: 12.5px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .bubble pre code { font: inherit; color: #25272b; }
  .bubble :not(pre) > code {
    font: 12.5px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    background: #f2f3f6; border-radius: 5px; padding: 1px 5px;
  }
  details.think { margin: 0 0 8px; }
  details.think summary {
    cursor: pointer; font-size: 12px; color: var(--muted); list-style: none;
    user-select: none;
  }
  details.think summary::-webkit-details-marker { display: none; }
  details.think summary::before { content: "▸ "; }
  details.think[open] summary::before { content: "▾ "; }
  details.think .body {
    margin-top: 6px; padding: 8px 10px; border-left: 2px solid var(--line);
    color: #6b7280; font-size: 13px; white-space: pre-wrap;
  }
  .meta { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; font-size: 12px; color: var(--muted); }
  .meta span { border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; background: var(--card); }
  .cursor::after {
    content: "▍"; margin-left: 1px; animation: blink 1s steps(2, start) infinite; color: var(--muted);
  }
  @keyframes blink { to { visibility: hidden; } }
  footer.composer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 9;
    padding: 12px 20px 18px;
    background: linear-gradient(to top, var(--bg) 62%, rgba(246,247,249,0));
  }
  .composer .box {
    max-width: 820px; margin: 0 auto;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; box-shadow: var(--shadow);
    padding: 10px 10px 8px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .composer textarea {
    font: inherit; resize: none; border: 0; outline: none; background: transparent;
    min-height: 24px; max-height: 220px; padding: 4px 6px; color: var(--text);
  }
  .composer .row { display: flex; align-items: center; gap: 8px; }
  .composer .hint { font-size: 12px; color: var(--muted); }
  .composer .hint kbd {
    font: inherit; font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 5px; padding: 0 4px; background: #fafbfc; color: #5b616b;
  }
  .panel {
    position: fixed; inset: 0; z-index: 20; display: none;
    background: rgba(20,22,26,.22); backdrop-filter: blur(2px);
    align-items: flex-start; justify-content: center; padding: 10vh 20px 20px;
  }
  .panel.open { display: flex; }
  .panel .sheet {
    width: 100%; max-width: 520px; background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; box-shadow: 0 24px 60px rgba(16,18,22,.18); padding: 18px 20px;
  }
  .panel h2 { margin: 0 0 4px; font-size: 16px; letter-spacing: -.01em; }
  .panel p { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
  .panel label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 6px; }
  .panel input { width: 100%; max-width: none; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .panel .pw { display: flex; gap: 8px; align-items: center; }
  .panel .pw button { flex: 0 0 auto; }
  .panel .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .toast {
    position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(8px);
    background: #17181b; color: #fff; font-size: 13px;
    padding: 8px 14px; border-radius: 10px; opacity: 0; pointer-events: none;
    transition: opacity .16s ease, transform .16s ease; z-index: 30;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (max-width: 620px) {
    header { padding: 10px 12px; gap: 8px; }
    .field { flex: 1 1 100%; min-width: 0; flex-wrap: wrap; }
    .field select { flex: 1 1 44%; min-width: 0; max-width: none; }
    main { padding: 16px 12px 160px; }
    .field input { max-width: 150px; }
    .composer .hint { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">magpie <small>chat</small></div>
  <span class="pill" id="status"><span class="dot" id="dot"></span><span id="statusText">连接中…</span></span>
  <div class="spacer"></div>
  <div class="field">
    <select id="gateway" title="magpie 网关"></select>
    <select id="model" title="模型"></select>
    <button id="btnSettings" title="网关地址与 token">设置</button>
    <button id="btnClear" class="ghost" title="清空对话">清空</button>
  </div>
</header>

<main id="scroll">
  <div class="wrap" id="thread">
    <section class="empty" id="empty">
      <h1>经 magpie 网关聊天</h1>
      <p>模型、路由、用量都走 magpie 的配置。</p>
      <p class="gwline">
        <span>网关</span>
        <button type="button" class="link" id="gwNow" data-manual title="换网关 / 填 token">127.0.0.1:3425</button>
        <span class="gwline-meta" id="gwMeta">连接中…</span>
        <span class="gwline-sep">·</span>
        <button type="button" class="link subtle" data-scan title="扫描局域网里的 magpie">扫描局域网</button>
      </p>
      <div class="chips">
        <button data-p="用一句话说明 magpie 网关在做什么。">网关是干嘛的</button>
        <button data-p="列出三条让日常开发更快的小建议，每条不超过二十字。">来点小建议</button>
        <button data-p="写一个 bash 函数，把目录下最大的 5 个文件按大小倒序列出。">写段 bash</button>
      </div>
    </section>
  </div>
</main>

<footer class="composer">
  <div class="box">
    <textarea id="input" rows="1" placeholder="问点什么…"></textarea>
    <div class="row">
      <span class="hint"><kbd>Enter</kbd> 发送 · <kbd>Shift</kbd>+<kbd>Enter</kbd> 换行</span>
      <div class="spacer"></div>
      <button id="btnStop" class="ghost" hidden>停止</button>
      <button id="btnSend" class="primary">发送</button>
    </div>
  </div>
</footer>

<div class="panel" id="panel">
  <div class="sheet">
    <h2>网关</h2>
    <p>地址留空就用本机 <code>127.0.0.1:3425</code>；也可以填局域网里另一台 magpie，比如
      <code>192.168.1.9:3425</code>，那时要填那台机器自己的 token。</p>
    <label for="gw">magpie 地址</label>
    <input id="gw" type="text" spellcheck="false" autocomplete="off" placeholder="http://127.0.0.1:3425">
    <div class="proxy-row" id="proxyRow" hidden>
      <label for="proxy">代理地址（本机跑的 serve.py）</label>
      <input id="proxy" type="text" spellcheck="false" autocomplete="off" placeholder="http://127.0.0.1:8088">
    </div>
    <label for="token">token</label>
    <span class="pw">
      <input id="token" type="password" spellcheck="false" autocomplete="off" placeholder="sk-magpie-key-…">
      <button type="button" id="btnReveal" class="ghost" title="显示 / 隐藏">显示</button>
    </span>
    <div class="actions">
      <button id="btnTokenCancel" class="ghost">取消</button>
      <button id="btnTokenSave" class="primary">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  // 直接从本机/局域网打开时用同源代理；从 GitHub Pages 这类静态站点打开时，
  // 页面需要一个本机跑着的 serve.py 当代理（浏览器允许 https 页面访问 127.0.0.1）。
  const HOST = location.hostname;
  const LOCAL_HOST = HOST === "" || HOST === "localhost" || HOST === "::1" || HOST === "[::1]"
    || /^127\./.test(HOST)
    || /^10\./.test(HOST)
    || /^192\.168\./.test(HOST)
    || /^172\.(1[6-9]|2\d|3[01])\./.test(HOST)
    || /\.local$/i.test(HOST);
  const DEFAULT_PROXY = "http://127.0.0.1:8088";

  const $ = (id) => document.getElementById(id);
  const els = {
    status: $("status"), dot: $("dot"), statusText: $("statusText"),
    gateway: $("gateway"), gwNow: $("gwNow"), gwMeta: $("gwMeta"),
    model: $("model"), input: $("input"), send: $("btnSend"), stop: $("btnStop"),
    clear: $("btnClear"), settings: $("btnSettings"), panel: $("panel"),
    token: $("token"), reveal: $("btnReveal"), gw: $("gw"), proxy: $("proxy"), proxyRow: $("proxyRow"),
    tokenSave: $("btnTokenSave"), tokenCancel: $("btnTokenCancel"),
    thread: $("thread"), empty: $("empty"), scroll: $("scroll"), toast: $("toast"),
  };

  const store = {
    get(key, fallback) {
      try { return localStorage.getItem("magpie." + key) ?? fallback; } catch { return fallback; }
    },
    set(key, value) {
      try { localStorage.setItem("magpie." + key, value); } catch {}
    },
  };

  let token = store.get("token", "");      // 本机从 /config.json 取，局域网设备拿不到
  let injected = false;                    // 服务端代持 key：浏览器里不发 token
  let gateway = store.get("gateway", "");  // 空 = 用服务端的默认网关
  let defaultGw = "http://127.0.0.1:3425"; // 来自 /config.json
  let proxyBase = LOCAL_HOST ? "" : store.get("proxy", DEFAULT_PROXY);
  let discovered = [];                     // 扫描到的网关
  let history = [];           // [{role, content}]
  let controller = null;      // 当前请求的 AbortController
  let models = [];

  function proxyUrl(path) {
    return (proxyBase ? proxyBase.replace(/\/+$/, "") : "") + path;
  }
  function apiUrl(path) {
    return proxyUrl("/v1" + path);
  }

  function stripScheme(url) {
    return String(url || "").replace(/^https?:\/\//, "").replace(/\/+$/, "");
  }
  function gatewayLabel() {
    return gateway ? stripScheme(gateway) : stripScheme(defaultGw);
  }
  function currentGwLabel() {
    return gatewayLabel();
  }

  // 顶栏和首页卡片共用一份网关列表
  function renderGateways() {
    const sel = els.gateway;
    if (!sel) return;
    const keep = gateway || "";
    sel.innerHTML = "";
    sel.appendChild(new Option("本机 · " + stripScheme(defaultGw), ""));
    const seen = new Set([""]);
    for (const g of discovered) {
      if (stripScheme(g.url) === stripScheme(defaultGw)) continue;
      const label = (g.authorized ? "" : "🔒 ") + stripScheme(g.url);
      sel.appendChild(new Option(label, g.url));
      seen.add(g.url);
    }
    if (keep && !seen.has(keep)) sel.appendChild(new Option("自定义 · " + stripScheme(keep), keep));
    sel.appendChild(new Option("手动填写…", "__manual"));
    sel.appendChild(new Option("扫描局域网…", "__scan"));
    sel.value = keep;
  }

  function updateGwCard() {
    if (els.gwNow) els.gwNow.textContent = currentGwLabel();
    if (!els.gwMeta) return;
    const hit = discovered.find((g) => stripScheme(g.url) === stripScheme(gateway || defaultGw));
    const bits = [];
    if (hit && hit.version) bits.push("v" + hit.version);
    if (models.length) bits.push(models.length + " 个模型");
    if (hit && !hit.authorized) bits.push("需要 token");
    els.gwMeta.textContent = bits.join(" · ") || "—";
  }

  function setGateway(value, opts) {
    gateway = (value || "").trim().replace(/\/+$/, "");
    store.set("gateway", gateway);
    renderGateways();
    updateGwCard();
    if (!opts || opts.reload !== false) loadModels();
  }

  async function scanLan() {
    const buttons = [...document.querySelectorAll("[data-scan]")];
    const originals = buttons.map((b) => b.textContent);
    buttons.forEach((b) => { b.disabled = true; b.textContent = "扫描中…"; });
    try {
      const res = await fetch(proxyUrl("/api/discover"), { headers: authHeaders(), cache: "no-store" });
      const data = await res.json();
      discovered = data.found || [];
      renderGateways();
      updateGwCard();
      const others = discovered.filter((g) => stripScheme(g.url) !== stripScheme(defaultGw));
      if (others.length) {
        toast(`发现 ${others.length} 个局域网 magpie`);
      } else {
        toast(`扫了 ${data.hosts} 个地址，只有本机在跑 magpie`);
      }
    } catch (err) {
      toast("扫描失败：" + err.message);
    } finally {
      buttons.forEach((b, i) => { b.disabled = false; b.textContent = originals[i]; });
    }
  }

  function authHeaders(extra) {
    const headers = Object.assign({}, extra || {});
    if (token) headers.Authorization = "Bearer " + token;
    if (gateway) headers["X-Magpie-Gateway"] = gateway;
    return headers;
  }

  async function loadConfig() {
    try {
      const cfg = await (await fetch(proxyUrl("/config.json"), { cache: "no-store" })).json();
      injected = !!cfg.injected;
      if (cfg.gateway) defaultGw = cfg.gateway;
      if (cfg.token) {
        token = cfg.token;
        store.set("token", token);
      }
      if (injected && !token) {
        els.settings.textContent = "设置";   // 地址仍可改，只是 token 由服务端代持
        const note = document.querySelector("#empty p, #thread .empty p");
        if (note) {
          note.textContent = "网关 token 由服务端代持，浏览器里不出现 key；模型、路由、用量都走 magpie 的配置。";
        }
      }
    } catch {}
    renderGateways();
    updateGwCard();
  }

  // ---------- 小工具 ----------

  function toast(text) {
    els.toast.textContent = text;
    els.toast.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => els.toast.classList.remove("show"), 1800);
  }

  function setStatus(kind, text) {
    els.dot.className = "dot" + (kind ? " " + kind : "");
    els.statusText.textContent = text;
  }

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }

  function atBottom() {
    return els.scroll.scrollHeight - els.scroll.scrollTop - els.scroll.clientHeight < 80;
  }
  function scrollDown(force) {
    if (force || atBottom()) els.scroll.scrollTop = els.scroll.scrollHeight;
  }

  function fmtNum(n) { return n == null ? "–" : n.toLocaleString("en-US"); }

  // 把 ``` 围栏代码块渲染成 <pre>,顺手把行内 `code` 也排上;只建节点,不拼 HTML
  function renderInto(node, text) {
    node.textContent = "";
    const chunks = String(text).split("```");
    chunks.forEach((chunk, i) => {
      if (i % 2 === 1) {
        const match = chunk.match(/^([A-Za-z0-9+#._-]*)\n/);
        const lang = match ? match[1] : "";
        const body = match ? chunk.slice(match[0].length) : chunk;
        const pre = el("pre");
        const code = el("code", null, body.replace(/\n$/, ""));
        if (lang) code.dataset.lang = lang;
        pre.appendChild(code);
        node.appendChild(pre);
        return;
      }
      if (!chunk) return;
      chunk.split(/(`[^`\n]+`)/).forEach((piece) => {
        if (piece.startsWith("`") && piece.endsWith("`") && piece.length > 2) {
          node.appendChild(el("code", null, piece.slice(1, -1)));
        } else if (piece) {
          node.appendChild(document.createTextNode(piece));
        }
      });
    });
  }

  // ---------- 模型 ----------

  function groupOf(id) {
    const i = String(id).indexOf("/");
    return i > 0 ? id.slice(0, i) : "其它";
  }

  async function loadModels() {
    setStatus("", "连接中…");
    try {
      const res = await fetch(apiUrl("/models"), { headers: authHeaders() });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      models = (data.data || []).map((m) => ({ id: m.id, name: m.display_name || m.id }));
      renderModels();
      const where = gateway ? " · " + gatewayLabel() : "";
      setStatus("ok", "在线 · " + models.length + " 个模型" + where);
      updateGwCard();
    } catch (err) {
      setStatus("bad", "网关没答话");
      els.model.innerHTML = "";
      els.model.appendChild(new Option("（取不到模型列表）", ""));
    }
  }

  function renderModels() {
    const preferred = store.get("model", "");
    const groups = new Map();
    for (const m of models) {
      const g = groupOf(m.id);
      if (!groups.has(g)) groups.set(g, []);
      groups.get(g).push(m);
    }
    els.model.innerHTML = "";
    const narrow = window.innerWidth < 640;   // 手机上只留名字，不然一定被截断
    // routing group 放最前面，一眼能选到
    const order = [...groups.keys()].sort((a, b) => (a === "auto" ? -1 : b === "auto" ? 1 : a.localeCompare(b)));
    for (const g of order) {
      const group = document.createElement("optgroup");
      group.label = g === "auto" ? "路由组" : g;
      for (const m of groups.get(g)) {
        const label = m.name === m.id ? m.id : (narrow ? m.name : m.name + " · " + m.id);
        const opt = new Option(label, m.id);
        opt.title = m.id;
        group.appendChild(opt);
      }
      els.model.appendChild(group);
    }
    const pick = models.find((m) => m.id === preferred)
      || models.find((m) => m.id === "deepseek/deepseek-flash")
      || models[0];
    if (pick) els.model.value = pick.id;
  }

  els.model.addEventListener("change", () => store.set("model", els.model.value));

  els.gateway.addEventListener("change", () => {
    const value = els.gateway.value;
    if (value === "__manual") {
      els.gateway.value = gateway || "";
      openPanel();
      return;
    }
    if (value === "__scan") {
      els.gateway.value = gateway || "";
      scanLan();
      return;
    }
    setGateway(value);
  });

  // ---------- token 面板 ----------

  function openPanel() {
    if (els.proxyRow) {
      els.proxyRow.hidden = LOCAL_HOST;
      els.proxy.value = proxyBase || DEFAULT_PROXY;
    }
    els.gw.value = gateway;
    els.gw.placeholder = "http://127.0.0.1:3425（留空即用这个）";
    els.token.value = token;
    els.token.type = "password";
    els.reveal.textContent = "显示";
    els.token.placeholder = (injected && !token) ? "服务端代持，留空即可" : "sk-magpie-key-…";
    els.panel.classList.add("open");
    els.gw.focus();
    els.gw.select();
  }
  function closePanel() { els.panel.classList.remove("open"); }

  els.reveal.addEventListener("click", () => {
    const masked = els.token.type === "password";
    els.token.type = masked ? "text" : "password";
    els.reveal.textContent = masked ? "隐藏" : "显示";
  });

  els.settings.addEventListener("click", openPanel);
  els.tokenCancel.addEventListener("click", closePanel);
  els.panel.addEventListener("click", (e) => { if (e.target === els.panel) closePanel(); });
  els.tokenSave.addEventListener("click", () => {
    const nextGw = els.gw.value.trim().replace(/\/+$/, "");
    token = els.token.value.trim();
    store.set("token", token);
    if (!LOCAL_HOST && els.proxy) {
      proxyBase = els.proxy.value.trim().replace(/\/+$/, "");
      store.set("proxy", proxyBase);
    }
    closePanel();
    setGateway(nextGw, { reload: false });
    toast(gateway ? "网关已切到 " + gatewayLabel() : "已用默认网关");
    loadModels();
  });

  // ---------- 渲染消息 ----------

  function addMessage(role, text) {
    els.empty?.remove();
    const wrap = el("div", "msg " + role);
    const who = el("div", "who");
    who.appendChild(el("b", null, role === "user" ? "你" : "magpie"));
    wrap.appendChild(who);
    const bubble = el("div", "bubble");
    bubble.textContent = text || "";
    wrap.appendChild(bubble);
    els.thread.appendChild(wrap);
    scrollDown(true);
    return { wrap, bubble, who };
  }

  function addThinking(bubble) {
    const details = el("details", "think");
    const summary = el("summary", null, "思考过程");
    const body = el("div", "body");
    details.appendChild(summary);
    details.appendChild(body);
    bubble.parentNode.insertBefore(details, bubble);
    return { details, body };
  }

  function addMeta(wrap) {
    const meta = el("div", "meta");
    wrap.appendChild(meta);
    return meta;
  }

  function metaChip(meta, text) {
    meta.appendChild(el("span", null, text));
  }

  // ---------- 发送 ----------

  function setBusy(busy) {
    els.send.disabled = busy;
    els.stop.hidden = !busy;
  }

  async function send(text) {
    if (!text.trim() || controller) return;
    history.push({ role: "user", content: text });
    addMessage("user", text);

    const view = addMessage("assistant", "");
    view.bubble.classList.add("cursor");
    const meta = addMeta(view.wrap);
    const started = performance.now();

    controller = new AbortController();
    setBusy(true);

    let answer = "";
    let reasoning = "";
    let think = null;
    let usage = null;
    let model = els.model.value;

    try {
      const res = await fetch(apiUrl("/chat/completions"), {
        method: "POST",
        headers: authHeaders({ "Content-Type": "application/json" }),
        body: JSON.stringify({
          model,
          messages: history.slice(-40),
          stream: true,
          stream_options: { include_usage: true },
        }),
        signal: controller.signal,
      });

      if (!res.ok) {
        const body = await res.text();
        let msg = body;
        try { msg = JSON.parse(body).error?.message || body; } catch {}
        throw new Error("HTTP " + res.status + " · " + msg);
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop() || "";
        for (const raw of lines) {
          const line = raw.trim();
          if (!line.startsWith("data:")) continue;
          const payload = line.slice(5).trim();
          if (!payload || payload === "[DONE]") continue;
          let chunk;
          try { chunk = JSON.parse(payload); } catch { continue; }
          if (chunk.model) model = chunk.model;
          if (chunk.usage) usage = chunk.usage;
          const choice = chunk.choices && chunk.choices[0];
          if (!choice) continue;
          const delta = choice.delta || {};
          if (delta.reasoning_content) {
            if (!think) think = addThinking(view.bubble);
            reasoning += delta.reasoning_content;
            think.body.textContent = reasoning;
          }
          if (delta.content) {
            answer += delta.content;
            renderInto(view.bubble, answer);
            scrollDown(false);
          }
        }
      }
      if (think) think.details.removeAttribute("open");
    } catch (err) {
      if (err.name === "AbortError") {
        if (!answer) view.bubble.textContent = "（已停止）";
      } else {
        view.bubble.classList.add("err");
        view.bubble.textContent = answer ? answer + "\n\n[出错] " + err.message : "请求失败：" + err.message;
        setStatus("bad", "请求失败");
      }
    } finally {
      controller = null;
      setBusy(false);
      view.bubble.classList.remove("cursor");
      const ms = Math.round(performance.now() - started);
      metaChip(meta, model || "未知模型");
      metaChip(meta, (ms / 1000).toFixed(1) + " s");
      if (usage) {
        metaChip(meta, "输入 " + fmtNum(usage.prompt_tokens));
        metaChip(meta, "输出 " + fmtNum(usage.completion_tokens));
        if (usage.completion_tokens_details?.reasoning_tokens) {
          metaChip(meta, "思考 " + fmtNum(usage.completion_tokens_details.reasoning_tokens));
        }
        metaChip(meta, "合计 " + fmtNum(usage.total_tokens));
      } else if (answer) {
        metaChip(meta, "约 " + Math.ceil(answer.length / 2) + " tokens");
      }
      if (answer) history.push({ role: "assistant", content: answer });
      scrollDown(false);
      els.input.focus();
    }
  }

  // ---------- 输入区 ----------

  function autoGrow() {
    els.input.style.height = "auto";
    els.input.style.height = Math.min(els.input.scrollHeight, 220) + "px";
  }

  function submit() {
    const text = els.input.value;
    if (!text.trim()) return;
    els.input.value = "";
    autoGrow();
    send(text);
  }

  els.input.addEventListener("input", autoGrow);
  els.input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      submit();
    }
  });
  els.send.addEventListener("click", submit);
  els.stop.addEventListener("click", () => controller?.abort());
  const homeNode = els.empty;   // 首页那块（含网关卡片），清空时原样挂回去

  els.clear.addEventListener("click", () => {
    if (controller) controller.abort();
    history = [];
    els.thread.innerHTML = "";
    if (homeNode) els.thread.appendChild(homeNode);
    els.empty = homeNode;
    updateGwCard();
    els.input.focus();
  });

  document.addEventListener("click", (e) => {
    if (e.target.closest("[data-scan]")) {
      scanLan();
      return;
    }
    if (e.target.closest("[data-manual]")) {
      openPanel();
      return;
    }
    // 空状态里的示例提示
    const chip = e.target.closest("[data-p]");
    if (!chip) return;
    els.input.value = chip.dataset.p;
    autoGrow();
    submit();
  });

  // ---------- 启动 ----------

  // 调试句柄:控制台里可以 magpieChat.render(el, '文本') 看渲染效果
  window.magpieChat = { render: renderInto };

  (async function boot() {
    await loadConfig();
    await loadModels();
    // 深链：?q=问题 直接问，?q=问题&send=0 只填进输入框
    const params = new URLSearchParams(location.search);
    const q = params.get("q");
    if (q) {
      els.input.value = q;
      autoGrow();
      if (params.get("send") !== "0") submit();
    }
    els.input.focus();
  })();
})();
</script>
</body>
</html>
